<form [formGroup]="form" class="form-container">
  <div class="container-cadastrar-tarefa">
    <h2>Cadastrar Tarefa</h2>
    <mat-form-field appearance="outline">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" placeholder="Título" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <textarea
        matInput
        formControlName="descricao"
        placeholder="Descrição"
        #input
        maxlength="300"
        (input)="onInput($event)"
      ></textarea>
      <mat-hint align="end">{{ value().length }}/300</mat-hint>
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Choose a date</mat-label>
      <input matInput formControlName="data" [matDatepicker]="picker" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker [dateClass]="dataClass" #picker></mat-datepicker>
    </mat-form-field>
    <!-- salvar e cancelar -->
    <button mat-raised-button color="primary" (click)="onSubmit()">Salvar</button>
    <button mat-raised-button color="primary" (click)="onCancel()">Cancelar</button>
  </div>
</form>
